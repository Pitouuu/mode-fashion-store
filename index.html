function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('rtl',lang==='ar');let t=tr();document.getElementById('app').innerHTML=`<div class="announcement">${t.announce}</div><header class="header"><div class="top"><div class="brand" onclick="go('home')">MODE.</div><div class="header-search"><span aria-hidden="true">⌕</span><input type="search" aria-label="${t.search}" placeholder="${t.search}" onkeydown="if(event.key==='Enter')globalSearch(this.value)"><button class="clear" onclick="globalSearch(this.previousElementSibling.value)" aria-label="Search">→</button></div><div class="header-actions"><select class="lang" aria-label="Language" onchange="setLang(this.value)"><option value="fr" ${lang==='fr'?'selected':''}>FR</option><option value="en" ${lang==='en'?'selected':''}>EN</option><option value="ar" ${lang==='ar'?'selected':''}>العربية</option></select><button class="iconbtn" aria-label="Favorites" onclick="showFavorites()">♡</button><button class="iconbtn" aria-label="Bag" onclick="showCart()">♧<span class="count">${cart.reduce((a,x)=>a+x.qty,0)}</span></button></div></div><nav class="nav"><button class="${view==='home'?'active':''}" onclick="go('home')">${t.home}</button><button class="${view==='new'?'active':''}" onclick="go('new')">${t.new}</button><button onclick="go('thrift')">${t.thrift}</button><button onclick="go('pod')">POD</button></nav></header>${view==='home'?`<section class="hero"><div class="hero-copy"><span class="eyebrow">THE NEW MODE / MOROCCO</span><h1>${t.hero}</h1><p>${t.heroText}</p><button class="primary" onclick="go('new')">${t.shop} →</button></div><div class="hero-art" role="img" aria-label="Fashion editorial"></div></section><main class="container"><div class="section-title"><span class="eyebrow">THE MODE</span><h2>${t.explore}</h2><p>${t.exploreSub}</p></div><div class="worlds">${worlds()}</div>${catalog(t.discover)}</main>`:view==='new'?`<main class="container">${catalog(t.allNew)}</main>`:`<main class="container"><div class="section-title"><span class="eyebrow">THE MODE</span><h2>${view==='thrift'?t.thrift:'POD'}</h2><p>${t.soon}</p></div><div style="max-width:600px;margin:30px auto;text-align:center"><p>${view==='thrift'?t.thriftSub:t.podSub}</p><button class="primary" onclick="alert('${t.soon}')">${t.notify}</button></div></main>`}<section class="coupon-strip"><span class="eyebrow">${t.coupon}</span><h2>${t.couponText}</h2><p class="notice">${t.couponNote}</p></section><section class="benefits"><div><strong>🚚 ${t.shipping}</strong><small>${t.shippingNote}</small></div><div><strong>✦ ${t.about}</strong><small>${t.foot}</small></div><div><strong>♡ ${t.returns}</strong><small>${t.returnsNote}</small></div></section><footer class="footer"><div><h3>MODE.</h3><p>${t.foot}</p></div><div><b>NEW · THRIFT · POD</b><p class="notice">${t.demo}</p></div></footer>`;renderProducts()}
function worlds(){let t=tr(),w=[['new',t.new,t.newSub,'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800&q=80'],['thrift',t.thrift,t.thriftSub,'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&q=80'],['pod','POD',t.podSub,'https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=800&q=80']];return w.map(([v,n,s,img])=>`<div class="world" onclick="go('${v}')"><img src="${img}" alt="${n}"><div class="world-label"><strong>${n}</strong><small>${v==='new'?s.toUpperCase():t.soon}</small></div></div>`).join('')}
function catalog(title){let t=tr();return `<section id="catalog"><div class="catalog-heading"><div><span class="eyebrow">CURATED FOR YOU</span><h2>${title}</h2></div><span class="muted" id="product-count"></span></div><div class="filters"><input aria-label="Search" placeholder="${t.search}" value="${filters.q}" oninput="filter('q',this.value)">${selectHtml('gender',['women','men','unisex'],t.gender)}${selectHtml('style',['smart','street','sport'],t.style)}${selectHtml('type',['tops','bottoms','outer','accessories'],t.type)}<select aria-label="Size" onchange="filter('size',this.value)"><option value="">${t.size}</option>${['S','M','L','XL','ONE'].map(s=>`<option ${filters.size===s?'selected':''}>${s}</option>`).join('')}</select><select aria-label="Max price" onchange="filter('max',this.value)"><option value="">${t.price}</option>${[100,150,200,250,300].map(x=>`<option value="${x}" ${filters.max==x?'selected':''}>${x} MAD</option>`).join('')}</select><select aria-label="Sort" onchange="filter('sort',this.value)"><option value="">${t.sort}</option><option value="low" ${filters.sort==='low'?'selected':''}>Price ↑</option><option value="high" ${filters.sort==='high'?'selected':''}>Price ↓</option></select><button class="clear" onclick="reset()">${t.clear}</button></div><div id="product-area"></div></section>`}
function openProduct(id){let p=P.find(x=>x.id===id);if(!p)return;selected=id;let t=tr();document.getElementById('modal').innerHTML=`<img src="${photo(p,850)}" alt="${name(p)}"><div class="modal-info"><button class="close" onclick="closeAll()">×</button><span class="pill">NEW · ${t[p.style]}</span><h2 style="font:normal 32px Georgia,serif">${name(p)}</h2><h3>${p.price} MAD</h3><p class="muted">${t[p.gender]} · ${t[p.type]}</p><label>${t.selectSize}</label><select id="modal-size"><option value="">${t.selectSize}</option>${p.sizes.map(s=>`<option>${s}</option>`).join('')}</select><button class="primary" onclick="addCart(${id},document.getElementById('modal-size').value)">${t.add}</button><p class="notice">${t.demo}</p></div>`;document.getElementById('modal').classList.add('open');document.getElementById('overlay').classList.add('open')}
function showCart(){let t=tr();document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h2>${t.bag}</h2><button class="close" onclick="closeAll()">×</button></div><div class="drawer-items">${cart.length?cart.map((x,i)=>{let p=P.find(p=>p.id===x.id);if(!p)return '';return `<div class="cartitem"><img src="${photo(p,200)}"><div><b>${name(p)}</b><div>${x.size} · ${t.quantity}: ${x.qty}</div><div>${p.price*x.qty} MAD</div><button onclick="removeCart(${i})">${t.remove}</button></div></div>`}).join(''):`<p class="empty">${t.empty}</p>`}</div><div class="drawer-bottom"><p>${t.subtotal}: <b>${cart.reduce((a,x)=>a+(P.find(p=>p.id===x.id)?.price||0)*x.qty,0)} MAD</b></p><button class="primary" disabled style="opacity:.5;cursor:not-allowed">${t.checkout}</button><p class="notice">${t.demo}</p></div>`;document.getElementById('overlay').classList.add('open');document.getElementById('drawer').classList.add('open')}
function showFavorites(){let t=tr(),a=P.filter(p=>favorites.has(p.id));document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h2>${t.favorites}</h2><button class="close" onclick="closeAll()">×</button></div><div class="drawer-items">${a.length?a.map(p=>`<div class="cartitem" style="cursor:pointer" onclick="closeAll();openProduct(${p.id})"><img src="${photo(p,200)}"><div><b>${name(p)}</b><p>${p.price} MAD</p></div></div>`).join(''):`<p class="empty">${t.noProducts}</p>`}</div>`;document.getElementById('overlay').classList.add('open');document.getElementById('drawer').classList.add('open')}
function closeAll(){document.getElementById('overlay').classList.remove('open');document.getElementById('drawer').classList.remove('open');document.getElementById('modal').classList.remove('open')}render();
async function loadCatalog(){
 try {
  const {data,error}=await MODE_DB.from('products').select('*,product_variants(*)').eq('published',true).order('created_at',{ascending:false});
  if(error)throw error;
  P=(data||[]).map(p=>({id:p.id,name:p.name_en||p.name_fr||'',fr:p.name_fr||p.name_en||'',ar:p.name_ar||p.name_en||'',price:Number(p.price_mad||0),gender:p.gender||'unisex',style:p.style||'street',type:p.product_type||'tops',collection:p.collection||'new',active:p.published!==false,imageUrl:p.image_url||'',sizes:[...new Set((p.product_variants||[]).map(v=>v.size).filter(Boolean))],stock:(p.product_variants||[]).reduce((n,v)=>n+Number(v.stock_quantity||0),0)}));
  render();
 }catch(e){console.error('MODE catalog could not load:',e);document.getElementById('product-area').innerHTML='<div class="empty">Catalog temporarily unavailable. Please try again later.</div>'}
}
loadCatalog();
</script></body></html>
